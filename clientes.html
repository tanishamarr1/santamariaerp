<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" href="assets/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Clientes · Constructora Santamaria</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="app-shell" id="app-shell">
  <main class="main">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="mobile-menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
        <div>
          <div class="eyebrow">Directorio</div>
          <h1>Clientes</h1>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="theme-toggle" onclick="alternarTema()"><i id="theme-toggle-icon" class="fa-solid fa-moon"></i></button>
        <button class="btn btn-primary" id="btn-nuevo-cliente"><i class="fa-solid fa-user-plus"></i> Nuevo cliente</button>
      </div>
    </div>

    <div class="card" style="padding: 18px 20px;">
      <div class="filters-bar">
        <div class="search-input">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="input-buscar-cliente" placeholder="Buscar cliente por nombre, correo o teléfono...">
        </div>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Nombre</th><th>Teléfono</th><th>Correo</th><th>RNC</th><th>Facturas</th><th>Acciones</th></tr>
          </thead>
          <tbody id="tabla-clientes">
            <tr><td colspan="6" style="text-align:center; color:var(--ink-faint); padding:30px;">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Modal de cliente (crear/editar) -->
<div class="modal-overlay" id="cliente-modal-overlay">
  <div class="modal-box" style="max-width: 460px;">
    <h3 id="cliente-modal-titulo">Nuevo cliente</h3>
    <div class="field">
      <label>Nombre</label>
      <input type="text" id="cm-nombre" placeholder="Nombre completo o razón social">
    </div>
    <div class="field-row">
      <div class="field"><label>Teléfono</label><input type="text" id="cm-telefono" placeholder="(809) 000-0000"></div>
      <div class="field"><label>RNC</label><input type="text" id="cm-rnc" placeholder="000-00000-0"></div>
    </div>
    <div class="field"><label>Correo</label><input type="email" id="cm-correo" placeholder="cliente@correo.com"></div>
    <div class="field"><label>Dirección</label><input type="text" id="cm-direccion" placeholder="Calle, sector, ciudad"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cm-cancelar">Cancelar</button>
      <button class="btn btn-primary" id="cm-guardar"><i class="fa-solid fa-floppy-disk"></i> Guardar cliente</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/ui.js"></script>
<script src="js/clientes.js"></script>
</body>
</html>
