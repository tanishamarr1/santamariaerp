<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" href="assets/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Iniciar sesión · Constructora Santamaria</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <img class="mark logo-img" src="assets/logo-icon.png" alt="Santamaria Constructora">
      <h1>Constructora Santamaria</h1>
      <p>Sistema de facturación</p>
    </div>

    <form class="login-form" id="form-login" autocomplete="off">
      <div class="login-error" id="login-error">Usuario o contraseña incorrectos.</div>
      <div class="field">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="Tu usuario" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary login-submit">
        <i class="fa-solid fa-right-to-bracket"></i> Iniciar sesión
      </button>
    </form>
    <p class="login-hint">Acceso restringido al personal de Constructora Santamaria</p>
  </div>
</div>

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
